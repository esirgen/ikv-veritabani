<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle / Rounded Rectangle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Altın Kenarlık Çerçevesi -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Mühendislik Kılavuz Çizgileri -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4,8">
    <circle cx="256" cy="256" r="200" fill="none"/>
    <circle cx="256" cy="256" r="130" fill="none"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
  </g>

  <!-- KULE VİNÇ SİLÜETİ -->
  <g filter="url(#dropShadow)">
    <!-- Vinç Tabanı & Ayakları -->
    <polygon points="170,430 290,430 260,390 200,390" fill="url(#goldGrad)"/>
    <rect x="160" y="430" width="140" height="12" rx="4" fill="#e2e8f0"/>

    <!-- Ana Kule Gövdesi (Mast Kafes) -->
    <rect x="212" y="160" width="36" height="230" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Çapraz Kuşaklar (Lattice) -->
    <g stroke="url(#goldGrad)" stroke-width="3">
      <line x1="212" y1="160" x2="248" y2="200"/>
      <line x1="248" y1="160" x2="212" y2="200"/>
      <line x1="212" y1="200" x2="248" y2="240"/>
      <line x1="248" y1="200" x2="212" y2="240"/>
      <line x1="212" y1="240" x2="248" y2="280"/>
      <line x1="248" y1="240" x2="212" y2="280"/>
      <line x1="212" y1="280" x2="248" y2="320"/>
      <line x1="248" y1="280" x2="212" y2="320"/>
      <line x1="212" y1="320" x2="248" y2="360"/>
      <line x1="248" y1="320" x2="212" y2="360"/>
      <line x1="212" y1="360" x2="248" y2="390"/>
      <line x1="248" y1="360" x2="212" y2="390"/>
    </g>

    <!-- Operatör Kabini -->
    <rect x="248" y="165" width="28" height="35" rx="4" fill="#38bdf8" fill-opacity="0.85" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="256" y1="165" x2="256" y2="200" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="248" y1="182" x2="276" y2="182" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Tepe Piramidi (Apex) -->
    <polygon points="210,160 250,160 230,80" fill="url(#goldGrad)" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="230" cy="80" r="8" fill="#ffffff"/>

    <!-- Karşı Bom ve Karşı Ağırlık Balastı -->
    <line x1="230" y1="155" x2="90" y2="155" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="230" y1="80" x2="100" y2="155" stroke="#f59e0b" stroke-width="3"/>
    <rect x="92" y="145" width="40" height="30" rx="3" fill="#64748b" stroke="#f8fafc" stroke-width="2"/>
    <line x1="105" y1="145" x2="105" y2="175" stroke="#334155" stroke-width="2"/>
    <line x1="118" y1="145" x2="118" y2="175" stroke="#334155" stroke-width="2"/>

    <!-- Ana Bom (Jib) -->
    <line x1="230" y1="155" x2="440" y2="155" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <line x1="230" y1="142" x2="410" y2="153" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Bom Halat Gergileri -->
    <line x1="230" y1="80" x2="320" y2="155" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="230" y1="80" x2="390" y2="155" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3"/>

    <!-- Bom Çaprazları -->
    <g stroke="url(#goldGrad)" stroke-width="2.5">
      <line x1="245" y1="143" x2="265" y2="155"/>
      <line x1="265" y1="144" x2="285" y2="155"/>
      <line x1="285" y1="145" x2="305" y2="155"/>
      <line x1="305" y1="147" x2="325" y2="155"/>
      <line x1="325" y1="148" x2="345" y2="155"/>
      <line x1="345" y1="149" x2="365" y2="155"/>
      <line x1="365" y1="150" x2="385" y2="155"/>
      <line x1="385" y1="152" x2="405" y2="155"/>
    </g>

    <!-- Şaryo -->
    <rect x="330" y="156" width="22" height="12" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="335" cy="157" r="3" fill="#f59e0b"/>
    <circle cx="347" cy="157" r="3" fill="#f59e0b"/>

    <!-- Halat ve Kanca Bloğu -->
    <line x1="341" y1="168" x2="341" y2="245" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="150"/>
    <rect x="333" y="245" width="16" height="16" rx="3" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="341" cy="253" r="3.5" fill="#0f172a"/>
    <path d="M 341 261 Q 341 278, 332 278 A 7 7 0 0 1 332 267" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tipografi / Marka Adı -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="3">İNANIR</text>
    <text x="256" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#f59e0b" letter-spacing="4">KULE VİNÇ</text>
  </g>
</svg>